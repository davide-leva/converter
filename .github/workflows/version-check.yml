
name: version-check

on:
  workflow_call:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Verify project version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Validate VERSION and all project manifests.
          python3 scripts/version.py check

          if [[ "$REF" == refs/tags/* ]]; then
            echo "Checking release tag: $REF_NAME"

            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Invalid release tag: $REF_NAME"
              exit 1
            fi

            EXPECTED="${REF_NAME#v}"
            ACTUAL="$(cat VERSION)"
            ACTUAL="${ACTUAL//$'\r'/}"
            ACTUAL="${ACTUAL//$'\n'/}"

            if [[ "$EXPECTED" != "$ACTUAL" ]]; then
              echo "::error::Tag $REF_NAME does not match VERSION=$ACTUAL"
              exit 1
            fi

            # Compare with previous release history.
            bash scripts/check-version-bump.sh

          elif [[ "$EVENT" == "pull_request" ]]; then
            BASE="$(git merge-base "$PR_BASE" "$PR_HEAD")"
            bash scripts/check-version-bump.sh "$BASE..$PR_HEAD"

          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE"
            fi

            bash scripts/check-version-bump.sh "$BEFORE..$AFTER"

          else
            # First push of a new branch.
            bash scripts/check-version-bump.sh \
              --new-ref "$AFTER" origin \
              "refs/remotes/origin/$REF_NAME"
          fi

          echo "Version validation passed."
