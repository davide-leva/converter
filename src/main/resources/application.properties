server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:101MB}
server.error.include-message=never
app.data-dir=${DATA_DIR:./data}
app.public-url=${PUBLIC_URL:http://localhost:8080}
app.local-user=${LOCAL_USERNAME:admin}
app.local-password=${LOCAL_PASSWORD:}
app.registration=${ALLOW_REGISTRATION:true}
app.jwt-secret=${JWT_SECRET:}
app.jwt-hours=${JWT_HOURS:12}
app.oidc-issuer=${OIDC_ISSUER_URI:}
app.oidc-client-id=${OIDC_CLIENT_ID:}
app.oidc-client-secret=${OIDC_CLIENT_SECRET:}
app.oidc-scopes=${OIDC_SCOPES:openid,profile,email}
app.oidc-auth-method=${OIDC_AUTH_METHOD:client_secret_basic}
app.convert-timeout=${CONVERSION_TIMEOUT_SECONDS:120}
app.libreoffice=${LIBREOFFICE_BIN:libreoffice}

# Adopt pre-Flyway databases at version 0, then run the compatible V1 migration.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
